:root {
  --peach: #FCD0B0; --cream: #FDE1CB; --red: #D33106; --dred: #9B2B0C; --orange: #F79D18; --gold: #E0B335;
  --vine: #288514; --dgreen: #316C0F; --aqua: #A2EFD9; --steel: #739AC2; --brown: #916446;
  --stone-l: #C0C0C0; --stone-m: #808080; --stone-d: #6B6B6B; --ink: #070405; --cliff: #282C2A; --white: #F8F8F8;
  /* hover shades: each is a lighter version of its own colour, so a hover never changes hue or hides the text */
  --cream-hi: #FFF4EA; --peach-hi: #FEE8D8; --orange-hi: #FAC474; --aqua-hi: #D1F7EC; --red-hi: var(--red); --ink-hi: #5E5957;
  --page: var(--peach); --card: var(--cream); --text: var(--ink); --text-2: var(--cliff); --link: var(--dred);
  --focus: 0 0 0 3px var(--ink), 0 0 0 6px var(--orange);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
  --side-w: 248px;
  --font-px: NYCPixel, ui-monospace, Menlo, monospace;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font-family: var(--font-mono); font-size: 15px; line-height: 1.5; min-height: 100vh;
  display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-rows: 64px 1fr; grid-template-areas: "side top" "side main"; }
a { color: var(--link); text-decoration: underline; }
:focus-visible { outline: none; box-shadow: var(--focus); }
.skip { position: absolute; left: -999px; top: 0; background: var(--ink); color: var(--cream); padding: 8px 12px; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--text-2); }
.mono { font-family: var(--font-mono); }
.px { font-family: var(--font-px); text-transform: uppercase; }
h1, h2, h3 { margin: 0; font-family: var(--font-px); text-transform: uppercase; letter-spacing: 0.04em; font-weight: normal; }
h1 { font-size: 30px; line-height: 1.2; }
h2 { font-size: 20px; }
h3 { font-size: 20px; color: var(--dred); margin: var(--s4) 0 var(--s2); }

/* ---- sidebar ---- */
#side { grid-area: side; background: var(--cliff); color: var(--cream); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 36px; z-index: 30; }
#side::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 6px; background: repeating-linear-gradient(180deg, #288514 0 6px, #316C0F 6px 12px); pointer-events: none; }
#side ul { list-style: none; margin: 0; padding: 0 12px 0 8px; }
#side .grp { margin: 18px 0 4px 8px; font-family: var(--font-px); font-size: 20px; color: var(--gold); font-weight: normal; letter-spacing: 0.06em; }
#side a.navitem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; color: var(--cream); text-decoration: none; font-family: var(--font-px); font-size: 20px; text-transform: uppercase; border: 3px solid transparent; }

(function () {

  const NYC = window.NYC = window.NYC || {};
  NYC.TOKEN = document.querySelector('meta[name="nyc-token"]').content;
  NYC.S = { state: null, dash: null };
  NYC.STAGES = ['lead', 'briefed', 'quoted', 'signed', 'active', 'delivered', 'invoiced', 'paid', 'lost'];
  NYC.USE = ['PUBLIC', 'ANONYMISED', 'ASK FIRST', 'PRIVATE'];
  NYC.STATUS = ['MEASURED', 'THEY SAID IT', 'PLANNED'];
  NYC.CHANNELS = ['referral', 'Contra', 'Fiverr', 'agency', 'direct', 'inbound', 'other'];
  NYC.BASIS = ['fixed', 'hourly', 'retainer'];
  NYC.today = () => new Date().toLocaleDateString('en-CA');

  function h(tag, props, ...kids) {

          if (b.row_sha && b.row_sha !== rowSha(old)) throw new ApiError(409, 'conflict', 'That row changed since you loaded it. Reload the rows.', { path: rel });
          let cells;
          if (action === 'update') { cells = cellsFromFields(table, header, b.fields || {}, today, old, text); title = `Update row ${index + 1} of ${cfg.label}`; }
          else if (action === 'void') {
            cells = old.concat(Array(Math.max(0, header.length - old.length)).fill(''));
            if (table === 'ledger') { const n = header.indexOf('note'); cells[n] = `VOID ${today}: ${cells[n]}`.replace(/[: ]+$/, ''); }
            else if (table === 'quote-history') cells[header.indexOf('outcome')] = 'void';
            else if (!cells[0].startsWith('VOID')) cells[0] = `VOID: ${cells[0]}`;
            title = `Void row ${index + 1} of ${cfg.label}`;
          } else throw new ApiError(400, 'bad_request', 'unknown row action');
          nw = csvKind(table) ? csvReplace(text, index, cells) : mdReplace(text, cfg.header, index, cells);
        }
      }
      const op = overwriteOp(rel, nw, b.base_sha256, force);
      if (force) op.forced = true;
      const warn = [];
      if (cfg.guarded) warn.push('Guarded file: the ledger. Agents open it only when named.');
      if (action === 'void') warn.push('Voiding keeps the row and marks it. Totals and the HUD skip void rows.');
      return newPlan('row', title, [op], warn);
    }

    /* ---- undo (plan.restore_plan) ---- */
    async function planRestore(b) {
      const rel = b.path || ''; safeTarget(rel);
      const H = ctx.history(), options = H.history(rel, 50);
      if (!options.length) throw new ApiError(404, 'no_backup', 'No backup exists for this file. Files created by the console have none; delete them by hand if needed.');
      let chosen = options[0];
      if (b.backup) { const m = options.filter(o => o.backup === b.backup); if (!m.length) throw new ApiError(404, 'no_backup', 'That backup is not in the log.'); chosen = m[0]; }
      if (chosen.backup.split('/').some(p => p === '..' || p === '.' || p === '')) throw new ApiError(403, 'forbidden', 'bad backup path');
      const content = await ctx.io.readBackup(chosen.backup);
      if (content === null) throw new ApiError(404, 'no_backup', 'That backup file is missing.');
      const op = overwriteOp(rel, content);
      return newPlan('restore', `Restore ${rel} from the backup of ${chosen.time}`, [op], ['This replaces the current file. The current version is backed up first, so you can undo this too.'], { backup: chosen });
    }

    /* ---- confirm (plan.apply) ---- */
    async function confirm(planId) {
      const plan = store.get(planId), io = ctx.io;
      if (!plan) throw new ApiError(404, 'unknown_plan', 'That plan is unknown. Preview again.');
      if (plan._used || plan._expires < nowSec()) throw new ApiError(410, 'expired', 'That plan expired or was already applied. Preview again.');
      const before = {};
      for (const op of plan.ops) {
        safeTarget(op.path);
        const cur = await io.read(op.path); before[op.path] = cur;
        if (op.kind === 'create') { if (cur !== null) throw new ApiError(409, 'stale', `${op.path} now exists. Nothing was written.`, { path: op.path }); }
        else if (cur === null || sha256(cur) !== op.before_sha256) throw new ApiError(409, 'stale', `${op.path} changed since the preview. Nothing was written.`, { path: op.path });
      }
      plan._used = true;
      const bdir = `${stampOf(ctx.now())}-${planId}`, doneEdits = [], doneCreates = [], logOps = [];
      try {
        for (const op of plan.ops) {
          let backup = null;
          if (op.kind === 'create') { await io.create(op.path, op.content); doneCreates.push(op.path); }
          else {
            if (!op.changed) continue;
            await io.writeBackup(`${bdir}/${op.path}`, before[op.path]);
            doneEdits.push({ path: op.path, text: before[op.path] });
            const again = await io.read(op.path);
            if (again === null || sha256(again) !== op.before_sha256) throw new ApiError(409, 'stale', `${op.path} changed during apply.`, { path: op.path });
            await io.write(op.path, op.content);
            backup = `${bdir}/${op.path}`;
          }
          const back = await io.read(op.path);
          if (back === null || sha256(back) !== op.after_sha256) throw new ApiError(500, 'verify_failed', `${op.path} did not read back as written.`, { path: op.path });
          logOps.push({ path: op.path, kind: op.kind, before_sha256: op.before_sha256 === undefined ? null : op.before_sha256, after_sha256: op.after_sha256, backup });
        }
      } catch (exc) {
        for (const e of doneEdits) { try { await io.write(e.path, e.text); } catch (_) { /* best effort */ } }
        if (exc instanceof ApiError) { if (exc.data.created === undefined) exc.data.created = doneCreates; throw exc; }
        throw new ApiError(500, 'apply_partial', `A write failed: ${exc && exc.message}. Edited files were restored from backup.`, { created: doneCreates });
      }
      await io.appendLog(JSON.stringify({ time: isoSec(ctx.now()), plan_id: planId, step: plan.step, title: plan.title, ops: logOps }) + '\n');
      return { applied: logOps, backup_folder: doneEdits.length ? bdir : null };
    }

    async function post(path, body) {
      body = body || {};
      if (path === '/api/confirm') return { ok: true, ...(await confirm(String(body.plan_id || ''))) };
      if (path === '/api/plan/edit') return { ok: true, plan: planEdit(body) };
      if (path === '/api/plan/scroll') return { ok: true, plan: planScroll(body) };
      if (path === '/api/plan/row') return { ok: true, plan: planRow(body) };
      if (path === '/api/plan/restore') return { ok: true, plan: await planRestore(body) };
      if (path.startsWith('/api/plan/')) {
        const fn = STEP_PLANNERS[path.slice('/api/plan/'.length)];
        if (!fn) throw new ApiError(404, 'not_found', 'no such step');
        return { ok: true, plan: fn({ ctx, newPlan, createOp, overwriteOp, textOf, files, eng }, body.fields || {}, ctx.today()) };
      }
      throw new ApiError(404, 'not_found', 'no such endpoint');
    }
    return { post, confirm, planEdit, planScroll, planRow, planRestore, store };
  }

  /* ---------------- template filling (port of templates.py) ---------------- */
  const CHANNELS = ['referral', 'Contra', 'Fiverr', 'agency', 'direct', 'inbound', 'other'];
  const FINANCE_TEMPLATES = ['engagement', 'brief', 'quote', 'invoice', 'time', 'contract'];
  const DATED_H2 = '## ' + DATED_HEADING, DATED_PLACEHOLDER = '- YYYY-MM-DD: what happened, and where that is recorded.';
  function fillLabel(text, label, value, tname) {
    tname = tname || 'template';
    const ls = text.split('\n'), idx = []; ls.forEach((l, i) => { if (l.startsWith(label)) idx.push(i); });
    if (idx.length !== 1) throw mismatch(`${tname}: expected one line starting '${label}', found ${idx.length}`);
    if (value) ls[idx[0]] = `${label} ${value}`;
    return ls.join('\n');
  }
  function replaceLine(text, oldLine, newLine, tname) {
    tname = tname || 'template';
    const ls = text.split('\n'), idx = []; ls.forEach((l, i) => { if (l === oldLine) idx.push(i); });
    if (idx.length !== 1) throw mismatch(`${tname}: expected one line '${oldLine}', found ${idx.length}`);
    ls[idx[0]] = newLine;
    return ls.join('\n');
  }
  function sectionBounds(ls, heading, tname) {
    const idx = []; ls.forEach((l, i) => { if (pyStrip(l) === heading) idx.push(i); });
    if (idx.length !== 1) throw mismatch(`${tname || 'template'}: expected one heading '${heading}', found ${idx.length}`);
    const start = idx[0] + 1; let end = start;
    while (end < ls.length && !ls[end].startsWith('#')) end++;
    return [start, end];
  }
  function fillSection(text, heading, body, tname) {
    const ls = text.split('\n'), [start, end] = sectionBounds(ls, heading, tname);
    if (body) ls.splice(start, end - start, ...[''].concat(body.split('\n'), ['']));
    return ls.join('\n');
  }
  function insertInSection(text, heading, line, placeholder, tname) {
    const ls = text.split('\n'), [start, end] = sectionBounds(ls, heading, tname);
    if (placeholder !== undefined && placeholder !== null) for (let i = start; i < end; i++) if (ls[i] === placeholder) { ls[i] = line; return ls.join('\n'); }
    let last = null; for (let i = start; i < end; i++) if (pyStrip(ls[i])) last = i;
    if (last === null) ls.splice(start, 0, '', line); else ls.splice(last + 1, 0, line);
    return ls.join('\n');
  }
  const pyFloatStr = (n) => Number.isInteger(n) ? n.toFixed(1) : String(n);      // Python prints 3.0, not 3

  /* ---------------- the deal steps (port of steps.py; the grow-side steps stay in the console) ---------------- */
  const QH_ORDER = QUOTE_HISTORY_HEADER;
  function stepApi(A) {
    const { eng, files, textOf, createOp, overwriteOp, newPlan, ctx } = A;
    const loadTemplate = (name) => {
      if (!FINANCE_TEMPLATES.includes(name)) throw mismatch(`unknown template '${name}'`);
      const f = files().get(`finances/templates/${name}.md`);
      if (!f) throw mismatch(`template file missing: ${name}`);
      return f.text.replace(/\r\n/g, '\n');
    };
    const engOf = (id) => { const e = eng().engById(id || ''); if (!e) throw vErr('engagement_id', 'pick an engagement'); return e; };
    const qhRow = (f, outcome, hoursActual) => {
      const v = {};
      v.engagement_id = '';
      v.job_type = f.short('job_type', { required: true, cell: true });
      v.scope_summary = f.text('scope_summary', { maxlen: 400, cell: true });
      v.billing_basis = f.enum('billing_basis', [''].concat(BASIS), false);
      v.hourly_rate_usd = f.money('hourly_rate_usd');
      v.hours_per_week_expected = f.short('hours_per_week_expected', { cell: true });
      v.term_weeks = f.short('term_weeks', { cell: true });
      v.hours_actual = hoursActual === undefined ? '' : hoursActual;
      v.amount_quoted_usd = f.money('amount_quoted_usd');
      v.amount_signed_usd = f.money('amount_signed_usd');
      v.outcome = outcome;
      v.date_quoted = f.date('date_quoted');
      v.source_of_figure = f.text('source_of_figure', { required: true, maxlen: 400, cell: true });
      return v;
    };
    const appendQh = (vals, eid) => {
      vals.engagement_id = eid;
      const text = textOf('finances/quote-history.csv');
      return overwriteOp('finances/quote-history.csv', csvAppend(text, QH_ORDER.map(h => vals[h]), QH_ORDER));
    };
    const olderRowWarning = (eid) => eng().quoteHistory().some(r => r.engagement_id === eid)
      ? ['An older quote-history row exists for this engagement. The latest non-void row counts; void the old one in ROWS if you prefer.'] : [];
    const setStageIf = (text, path, stage) => E.parseFrontmatter(text).stage !== stage ? setFrontmatter(text, 'stage', stage, path) : text;
    return { loadTemplate, engOf, qhRow, appendQh, olderRowWarning, setStageIf };
  }

  STEP_PLANNERS.lead = (A, d, today) => {
    const S = stepApi(A), { createOp, newPlan, eng, ctx } = A, f = new Fields(d, today);
    const payer = f.slug('payer_slug'), engSlug = f.slug('eng_slug');
    if (['templates', 'quote-skill'].includes(payer) || ['templates', 'quote-skill'].includes(engSlug)) throw vErr('payer_slug', 'reserved name');
    const eid = `${payer}-${engSlug}`, have = eng().engById(eid);
    if (have) throw new ApiError(409, 'exists', `An engagement with id ${eid} already exists. Open it in edit mode.`, { open_path: have.path });
    const payerName = f.short('payer_name', { required: true }), title = f.short('eng_title', { required: true });
    let channel = f.enum('channel', CHANNELS);
    if (channel === 'other') channel = f.short('channel_other', { required: true });
    const day = f.date('date', { past: true, defaultToday: true}), client = f.slug('client_slug', false), folder = `finances/${payer}/${engSlug}`, t = 'engagement';
    let text = S.loadTemplate(t);
    const fm = [['id', eid], ['payer', payerName], ['channel', channel], ['stage', 'lead'], ['value', f.short('value')], ['next_action', f.short('next_action')], ['next_date', f.date('next_date')],
      ['client_record', client && ctx.clientRecordDir ? `${ctx.clientRecordDir}/${client}/record.md (when one exists)` : 'none yet'], ['use', 'PRIVATE']];
    for (const [k, v] of fm) text = setFrontmatter(text, k, v, t);
    text = replaceLine(text, '# <Payer> - <engagement>', `# ${payerName} - ${title}`, t);
    text = fillLabel(text, '**Who:**', f.short('who'), t);
    text = fillLabel(text, '**What they asked for:**', f.short('what_asked'), t);
    text = fillLabel(text, '**Dates they gave:**', f.short('dates_given'), t);
    text = insertInSection(text, DATED_H2, `- ${day}: ${f.short('first_line', { def: 'first contact' })}`, DATED_PLACEHOLDER, t);
    const b = 'brief';
    let brief = S.loadTemplate(b);
    brief = replaceLine(brief, '# Brief - <payer> - <engagement>', `# Brief - ${payerName} - ${title}`, b);
    for (const [label, name] of [['**Source:**', 'source'], ['**Job type:**', 'job_type'], ['**Length or hours, as they state it:**', 'length'], ['**Scope, as they supplied it:**', 'scope'], ['**Deadlines they gave:**', 'deadlines']]) brief = fillLabel(brief, label, f.short(name), b);
    brief = fillSection(brief, '## Their words', f.long('their_words'), b);
    brief = fillSection(brief, '## What is missing', f.long('missing'), b);
    const warnings = [];
    if (looksLikeContact(f.long('their_words'))) warnings.push('The pasted words look like they contain an email or phone number. The brief is private, but consider removing it.');
    warnings.push("Keep logins and keys for the client's systems out of this folder. This tool never asks for them.");
    return newPlan('lead', `New lead ${eid}`, [createOp(`${folder}/engagement.md`, text), createOp(`${folder}/brief.md`, brief)], warnings);
  };

  STEP_PLANNERS.update = (A, d, today) => {
    const S = stepApi(A), { newPlan, overwriteOp, textOf } = A, f = new Fields(d, today);
    const e = S.engOf(f.short('engagement_id', { required: true }));
    const stage = f.enum('stage', STAGES, true, e.stage), nextAction = f.short('next_action', { def: e.next_action }), nextDate = f.date('next_date');
    const note = f.short('note', { required: true }), day = f.date('date', { past: true, defaultToday: true });
    let text = textOf(e.path);
    const cur = E.parseFrontmatter(text);
    for (const [k, v] of [['stage', stage], ['next_action', nextAction], ['next_date', nextDate]]) if ((cur[k] === undefined ? '' : cur[k]) !== v) text = setFrontmatter(text, k, v, e.path);
    text = insertInSection(text, DATED_H2, `- ${day}: ${note}`, DATED_PLACEHOLDER);
    const warn = [];
    if (STAGES.indexOf(stage) < STAGES.indexOf(STAGES.includes(e.stage) ? e.stage : 'lead')) warn.push('This moves the stage backward.');
    if (stage === 'signed') warn.push('Use the AGREEMENT tile to record the agreement and its quote-history row.');
    return newPlan('update', `Update ${e.id}`, [overwriteOp(e.path, text)], warn);
  };

  STEP_PLANNERS.agreement = (A, d, today) => {
    const S = stepApi(A), { newPlan, overwriteOp, textOf } = A, f = new Fields(d, today);
    const e = S.engOf(f.short('engagement_id', { required: true })), kind = f.enum('kind', ['contract', 'platform_order']);
    const order = f.pattern('order_id', '^[A-Za-z0-9_#-]{1,64}$', 'letters, digits, _ # - only', kind === 'platform_order');
    const day = f.date('date', { past: true, defaultToday: true }), vals = S.qhRow(f, 'signed'), qh = S.appendQh(vals, e.id);
    let text = S.setStageIf(textOf(e.path), e.path, 'signed');
    const line = kind === 'contract' ? `- ${day}: agreement recorded: signed contract.md and PDF, filed by hand.` : `- ${day}: agreement recorded: platform order ${order}.`;
    text = insertInSection(text, DATED_H2, line, DATED_PLACEHOLDER);
    const warn = S.olderRowWarning(e.id).concat(['Keep logins and keys out of this folder. The signed PDF is filed by you; this tool does not create contract.md.']);
    return newPlan('agreement', `Record agreement for ${e.id}`, [overwriteOp(e.path, text), qh], warn);
  };

  STEP_PLANNERS.delivered = (A, d, today) => {
    const S = stepApi(A), { newPlan, overwriteOp, textOf } = A, f = new Fields(d, today);
    const e = S.engOf(f.short('engagement_id', { required: true })), day = f.date('date', { past: true, defaultToday: true });
    const hours = f.pattern('hours_actual', '^\\d{1,4}(\\.\\d{1,2})?$', 'a number like 12 or 12.5', false) || (e.hours ? pyFloatStr(e.hours) : '');
    const vals = S.qhRow(f, 'delivered', hours), ops = [S.appendQh(vals, e.id)];
    if (f.slug('wr_slug', false)) throw new ApiError(422, 'not_in_viewer', 'Work records are made in the full console. Leave the work record file name empty here.');
    if (f.boolean('set_stage', true)) {
      let text = S.setStageIf(textOf(e.path), e.path, 'delivered');
      text = insertInSection(text, DATED_H2, `- ${day}: delivered.`, DATED_PLACEHOLDER);
      ops.push(overwriteOp(e.path, text));
    }
    return newPlan('delivered', `Delivered: ${e.id}`, ops, S.olderRowWarning(e.id));
  };

  STEP_PLANNERS.hours = (A, d, today) => {
    const S = stepApi(A), { newPlan, createOp, overwriteOp, files, textOf } = A, f = new Fields(d, today);
    const e = S.engOf(f.short('engagement_id', { required: true })), rel = `${e.dir}/time.md`;
    const row = [f.date('date', { past: true, defaultToday: true }), f.hours('hours'), f.short('what', { required: true }), f.enum('billable', ['yes', 'no'], true, 'yes')];
    if (files().has(rel)) return newPlan('hours', `Log hours for ${e.id}`, [overwriteOp(rel, mdInsert(textOf(rel), '| Date | Hours', row))]);
    const t = 'time';
    let text = S.loadTemplate(t);
    text = replaceLine(text, '# Time - <payer> - <engagement>', `# Time - ${e.title}`, t);
    text = fillLabel(text, '**Billing basis:**', f.enum('billing_basis', BASIS), t);
    text = fillLabel(text, '**Rate:**', f.short('rate'), t);
    text = fillLabel(text, '**Hours cap or expected hours:**', f.short('cap'), t);
    text = mdInsert(text, '| Date | Hours', row);
    return newPlan('hours', `Start the time log for ${e.id}`, [createOp(rel, text)]);
  };

  STEP_PLANNERS.quote = (A, d, today) => {
    const S = stepApi(A), { newPlan, createOp, eng } = A, f = new Fields(d, today);
    const e = S.engOf(f.short('engagement_id', { required: true })), n = eng().nextQuoteNumber(e.dir), t = 'quote';
    let text = S.loadTemplate(t);
    text = replaceLine(text, '# Quote vN - <payer> - <engagement>', `# Quote v${n} - ${e.title}`, t);
    text = fillLabel(text, '**Date:**', f.date('date', { defaultToday: true }), t);
    text = fillLabel(text, '- Job type:', f.short('job_type'), t);
    text = fillLabel(text, '- Length or hours:', f.short('length'), t);
    text = fillLabel(text, '- Scope:', f.short('scope'), t);
    text = fillLabel(text, '- Amount:', f.short('amount', { def: 'To fill' }), t);
    text = fillLabel(text, '- Basis:', f.enum('basis', BASIS, false), t);
    text = fillLabel(text, '- Valid until:', f.date('valid_until'), t);
    text = fillSection(text, '## Assumptions', f.long('assumptions'), t);
    let basis = f.long('basis_for_price');
    const cites = (Array.isArray(d.cite_rows) ? d.cite_rows : []).filter(c => typeof c === 'string' && /^[a-z0-9-]+$/.test(c));
    if (cites.length) basis = (basis ? basis + '\n\n' : '') + 'Comparable jobs cited: ' + cites.join(', ');
    text = fillSection(text, '## Basis for the price', basis, t);
    text = fillSection(text, '## Not included', f.long('not_included'), t);
    return newPlan('quote', `Draft quote v${n} for ${e.id}`, [createOp(`${e.dir}/quote-v${n}.md`, text)],
      ['No price is calculated. The pricing method is deliberately unwritten; the number is yours.'], { comparables: eng().comparables(f.short('job_type')) });
  };

  const api = { create, ApiError, ValidationError, Fields, historyFrom, unifiedDiff, applyEdits, looksLikeContact, fmValue, setFrontmatter, csvRender, csvAppend, csvReplace, mdInsert, mdReplace, rowLine, safeTarget, warningsFor, pyStrip, isoAdd,
    STEP_PLANNERS, helpers: { mismatch, tableErr, vErr, mdRows, mdHeader, csvHeader, csvRowsOf, DATED_HEADING, QUOTE_HISTORY_HEADER, LEDGER_HEADER } };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else { root.NYC = root.NYC || {}; root.NYC.writer = api; }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* One-page viewer glue: no server. Reads the folder you choose (or an embedded snapshot) and serves the same screens as
   the full console through the in-browser engine. When the browser has given this page edit access to the folder (Chrome
   and Edge), it also edits: every change is planned and previewed by static/writer.js, the old version of any file it
   changes is copied into .backups/ inside the folder, and the result is read back and checked. */
(function () {
  'use strict';
  const NYC = window.NYC;
  NYC.READONLY = true;
  NYC.VIEWER = true;
  NYC.STEPS_OK = ['lead', 'update', 'agreement', 'hours', 'quote', 'delivered'];   // the deal steps; the grow-side forms are console only
  const { h, put, btn } = NYC;
  const NOT_BIZ = "That folder doesn't look like a Next Yes folder (no finances/ or the-next-yes/ inside). Choose the folder this page sits in.";
  const NAME_OK = /^[A-Za-z0-9][A-Za-z0-9._-]*$/, TEXT_EXT = /\.(md|csv)$/i, MAX_BYTES = 512 * 1024, BACKUPS = '.backups', LOG = 'apply-log.jsonl';
  let engine = null, hist = NYC.writer.historyFrom(''), setReady, first = true, current = { label: '', how: '', writable: false }, rootDir = null, probeNote = '', lastHandle = null, fileCount = 0, writer = null;
  const ready = new Promise(r => { setReady = r; });

  /* Files are read as UTF-8 exactly (a byte-order mark is kept, bad bytes are refused), so what is written back is what was read. */
  async function decode(file) { try { return new TextDecoder('utf-8', { fatal: true, ignoreBOM: true }).decode(await file.arrayBuffer()); } catch (_) { return null; } }

  /* ---- reading a folder chosen with the basic picker (works in every browser; read only) ---- */
  async function fromFileList(list) {
    const items = [...list].map(f => ({ f, rel: f.webkitRelativePath || f.name }));
    const count = {};
    items.forEach(({ rel }) => { const s = rel.split('/'); const i = s.findIndex(x => x === 'finances' || x === 'the-next-yes'); if (i >= 0) { const p = s.slice(0, i).join('/'); count[p] = (count[p] || 0) + 1; } });
    const prefixes = Object.keys(count);
    if (!prefixes.length) throw new Error(NOT_BIZ);
    const prefix = prefixes.sort((a, b) => count[b] - count[a])[0];
    const files = new Map(), names = new Map();
    for (const { f, rel } of items) {                       // only files inside the business folder are ever read
      if (prefix && !rel.startsWith(prefix + '/')) continue;
      const r = prefix ? rel.slice(prefix.length + 1) : rel, parts = r.split('/');
      if (parts.some(p => p.startsWith('.'))) continue;
      const dir = parts.slice(0, -1).join('/'), name = parts[parts.length - 1];
      if (!names.has(dir)) names.set(dir, []);
      names.get(dir).push(name);
      if (TEXT_EXT.test(name) && parts.every(p => NAME_OK.test(p)) && f.size <= MAX_BYTES) { const t = await decode(f); if (t !== null) files.set(r, { text: t, mtime: f.lastModified / 1000, size: f.size }); }
    }
    return { files, names, label: (prefix ? prefix.split('/').pop() : 'folder'), how: 'chosen folder (read only)', writable: false };
  }

  /* ---- reading a folder with the directory picker (Chrome, Edge: can be remembered and, with permission, written) ---- */
  async function entriesOf(dir) { const n = new Set(); for await (const [name] of dir.entries()) n.add(name); return n; }
  async function walk(dir, prefix, files, names) {
    const list = [];
    for await (const [name, handle] of dir.entries()) {
      if (name.startsWith('.')) continue;
      if (handle.kind === 'directory') { if (NAME_OK.test(name)) await walk(handle, prefix + name + '/', files, names); continue; }
      list.push(name);
      if (TEXT_EXT.test(name) && NAME_OK.test(name)) { const f = await handle.getFile(); if (f.size <= MAX_BYTES) { const t = await decode(f); if (t !== null) files.set(prefix + name, { text: t, mtime: f.lastModified / 1000, size: f.size }); } }
    }
    names.set(prefix.replace(/\/$/, ''), list);
  }
  async function collectBackups(dir, prefix, set) {
    for await (const [name, handle] of dir.entries()) {
      if (handle.kind === 'directory') await collectBackups(handle, prefix + name + '/', set);
      else if (prefix + name !== LOG) set.add(prefix + name);
    }
  }
  async function loadHistory(dir) {
    let text = '', set = new Set();
    try {
      const b = await dir.getDirectoryHandle(BACKUPS);
      try { text = await decode(await (await b.getFileHandle(LOG)).getFile()) || ''; } catch (_) { /* no log yet */ }
      await collectBackups(b, '', set);
    } catch (_) { /* no backups yet */ }
    return NYC.writer.historyFrom(text, set);
  }
  async function snapshotOf(dir) { const files = new Map(), names = new Map(); await walk(dir, '', files, names); return { files, names, hist: await loadHistory(dir) }; }
  async function fromHandle(root, writable) {
    let dir = root, entries = await entriesOf(dir);
    if (!entries.has('finances') && !entries.has('the-next-yes')) {
      for (const name of entries) {                          // one level down: the parent of a Next Yes folder
        if (name.startsWith('.')) continue;
        try { const sub = await dir.getDirectoryHandle(name); const e2 = await entriesOf(sub); if (e2.has('finances') || e2.has('the-next-yes')) { dir = sub; entries = e2; break; } } catch (_) { /* not a folder */ }
      }
    }
    if (!entries.has('finances') && !entries.has('the-next-yes')) throw new Error(NOT_BIZ);
    const snap = await snapshotOf(dir);
    return { ...snap, label: dir.name, how: writable ? 'live folder, edit access' : 'live folder (read only)', dir, writable: !!writable };
  }
  const DB = 'nyc-viewer', STORE = 'handles';
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  async function remember(handle) { try { const db = await idb(); await new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(handle, 'dir'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (_) { /* remembering is optional */ } }
  async function remembered() { try { const db = await idb(); return await new Promise((res) => { const q = db.transaction(STORE).objectStore(STORE).get('dir'); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (_) { return null; } }

  function fromSnapshot(s) {
    const files = new Map(Object.entries(s.files)), names = new Map(Object.entries(s.names || {}));
    return { files, names, label: 'snapshot ' + (s.built || ''), how: 'embedded snapshot (not live)', writable: false };
  }

  /* ---- file access for the writer: everything goes through the folder handle the browser gave us ---- */
  async function handleFor(rel, create, base) {
    const parts = rel.split('/');
    let d = base || rootDir;
    for (const p of parts.slice(0, -1)) d = await d.getDirectoryHandle(p, { create });
    return d.getFileHandle(parts[parts.length - 1], { create });
  }
  const missing = (e) => e && (e.name === 'NotFoundError' || e.name === 'TypeMismatchError');
  async function writeText(fh, text) {
    const w = await fh.createWritable();
    try { await w.write(text); await w.close(); } catch (e) { try { await w.abort(); } catch (_) { /* already closed */ } throw e; }
  }
  const backupsDir = (create) => rootDir.getDirectoryHandle(BACKUPS, { create });
  const io = {
    async read(rel) {
      let fh; try { fh = await handleFor(rel, false); } catch (e) { if (missing(e)) return null; throw e; }
      const t = await decode(await fh.getFile());
      if (t === null) throw new Error(rel + ' is not UTF-8 text');
      return t;
    },
    async create(rel, text) {
      let exists = true; try { await handleFor(rel, false); } catch (e) { if (missing(e)) exists = false; else throw e; }
      if (exists) throw new Error(rel + ' already exists');
      await writeText(await handleFor(rel, true), text);
    },
    async write(rel, text) { await writeText(await handleFor(rel, false), text); },
    async writeBackup(rel, text) { await writeText(await handleFor(rel, true, await backupsDir(true)), text); },
    async readBackup(rel) {
      try { return await decode(await (await handleFor(rel, false, await backupsDir(false))).getFile()); } catch (e) { if (missing(e)) return null; throw e; }
    },
    async appendLog(line) {
      const fh = await (await backupsDir(true)).getFileHandle(LOG, { create: true });
      const size = (await fh.getFile()).size, w = await fh.createWritable({ keepExistingData: true });
      try { await w.seek(size); await w.write(line); await w.close(); } catch (e) { try { await w.abort(); } catch (_) { /* closed */ } throw e; }
    },
  };

  const failure = (status, error, message) => { const e = new Error(message); e.status = status; e.data = { ok: false, error, message }; return e; };
  function asApiError(e) {
    if (e && e.data) return e;
    if (e && e.name === 'NotAllowedError') return failure(403, 'no_permission', 'The browser no longer allows editing this folder. Use CHANGE FOLDER and choose OPEN FOLDER TO EDIT again.');
    return failure(500, 'internal', (e && e.message) || 'Something went wrong while reading or writing the folder.');
  }
  async function refreshFromDisk() {
    const snap = await snapshotOf(rootDir);
    engine = NYC.engine.create(snap.files, snap.names, undefined, { history: snap.hist.history, applyLog: snap.hist.applyLog });
    hist = snap.hist; fileCount = snap.files.size; drawBox();
  }

  NYC.api = async function (path, body) {
    if (body === undefined) { await ready; return engine.get(path); }
    if (!current.writable || !rootDir) throw failure(403, 'read_only', 'This folder is open read-only. Use CHANGE FOLDER and choose OPEN FOLDER TO EDIT (Chrome or Edge) to make changes.');
    try {
      if (path !== '/api/confirm') await refreshFromDisk();   // plan against what is on disk right now
      const res = await writer.post(path, body);
      if (path === '/api/confirm') await refreshFromDisk();    // so every screen shows what was saved
      return res;
    } catch (e) { throw asApiError(e); }
  };

  /* ---- the edit-access check: write a small file, read it back, remove it, leave the folder as it was ---- */
  async function testWrite() {
    if (!rootDir || !current.writable) { probeNote = 'No edit access. Choose OPEN FOLDER TO EDIT.'; drawBox(); return; }
    const text = 'edit access check é — ✓ ' + Date.now() + '\n';
    let madeDir = false, note;
    try {
      let bdir;
      try { bdir = await rootDir.getDirectoryHandle(BACKUPS); } catch (_) { bdir = await rootDir.getDirectoryHandle(BACKUPS, { create: true }); madeDir = true; }
      const fh = await bdir.getFileHandle('write-test.txt', { create: true });
      await writeText(fh, text);
      const back = await (await fh.getFile()).text();
      await bdir.removeEntry('write-test.txt');
      if (madeDir) await rootDir.removeEntry(BACKUPS);
      note = back === text ? 'EDIT ACCESS OK: wrote, read back and removed a test file (' + new Blob([text]).size + ' bytes).' : 'EDIT ACCESS FAILED: the text read back was different.';
    } catch (e) { note = 'EDIT ACCESS FAILED: ' + ((e && e.name) || 'error') + (e && e.message ? ' - ' + e.message : ''); }
    probeNote = note + ' ' + new Date().toLocaleTimeString();
    drawBox();
  }

  /* ---- use the data ---- */
  function useData(d) {
    engine = NYC.engine.create(d.files, d.names, undefined, d.hist ? { history: d.hist.history, applyLog: d.hist.applyLog } : undefined);
    hist = d.hist || NYC.writer.historyFrom('');
    rootDir = d.dir || null;
    current = { label: d.label, how: d.how, writable: !!d.writable && !!d.dir };
    NYC.READONLY = !current.writable;
    document.body.classList.toggle('ro', NYC.READONLY);
    if (current.writable) writer = NYC.writer.create({ engine: () => engine, io, history: () => hist, today: NYC.today, now: () => new Date(), clientRecordDir: null });
    probeNote = '';
    const g = document.getElementById('gate'); if (g) g.remove();
    drawBox(d.files.size);
    setReady();
    if (!first && NYC.refreshAll) NYC.refreshAll();
    first = false;
  }

  /* ---- the start screen ---- */
  async function openPicker(mode) {
    try { const hd = await window.showDirectoryPicker({ mode }); lastHandle = hd; await remember(hd); useData(await fromHandle(hd, mode === 'readwrite')); }
    catch (e) {
      const name = (e && e.name) || 'Error';
      gate(name === 'AbortError'
        ? 'No folder was opened. If you cancelled, nothing is wrong. If you picked a folder and nothing happened, this browser did not give the page access to it: use OPEN (BASIC PICKER) to read the folder, or Chrome or Edge to edit it.'
        : name + ': ' + ((e && e.message) || String(e)));
    }
  }
  async function reconnect(hd) {
    let mode = 'readwrite', p = await hd.requestPermission({ mode });
    if (p !== 'granted') { mode = 'read'; p = await hd.requestPermission({ mode }); }
    if (p !== 'granted') throw new Error('Permission was not granted.');
    lastHandle = hd; useData(await fromHandle(hd, mode === 'readwrite'));
  }
  function gate(message) {
    const old = document.getElementById('gate'); if (old) old.remove();
    const msg = h('div', { class: 'errbox', role: 'alert', hidden: !message, text: message || '' });
    const input = h('input', { type: 'file', webkitdirectory: '', multiple: '', class: 'sr', id: 'pickdir', tabindex: '-1', 'aria-hidden': 'true' });
    input.addEventListener('change', async () => {
      if (!input.files.length) return;
      try { useData(await fromFileList(input.files)); } catch (e) { gate(e.message); }
    });
    const fsa = !!window.showDirectoryPicker;
    const box = h('div', { class: 'panel gate-box' },
      h('h1', { id: 'gate-t', text: 'THE NEXT YES' }),
      h('p', { text: 'A window onto your Next Yes folder: dashboard, deals, documents, tables and search. Nothing is installed and nothing is sent anywhere.' }),
      h('p', { class: 'hint', text: 'A web page cannot reach your files by itself. Choose the folder this page sits in (the one with finances/ and the-next-yes/ inside), or its parent. Only that folder is used.' }),
      fsa ? h('p', { class: 'hint', text: 'OPEN FOLDER TO EDIT also lets this page change files in that folder (Chrome and Edge ask you to allow it). Every change is shown first, and the old version of any file it changes is copied into a .backups folder inside yours, so you can undo it. OPEN READ-ONLY never changes anything.' })
        : h('p', { class: 'hint', text: 'This browser can only read the folder. Chrome or Edge can also edit it.' }), msg,
      h('div', { class: 'row' }, fsa ? btn('OPEN FOLDER TO EDIT', () => openPicker('readwrite'), 'primary') : null, fsa ? btn('OPEN READ-ONLY', () => openPicker('read')) : btn('OPEN FOLDER', () => input.click(), 'primary'), fsa ? btn('OPEN (BASIC PICKER)', () => input.click(), 'small') : null),
      h('div', { id: 'gate-remembered', class: 'row' }), input);
    const el = h('div', { id: 'gate', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'gate-t' }, box);
    document.body.append(el);
    const firstBtn = el.querySelector('button'); if (firstBtn) firstBtn.focus();
    if (fsa) remembered().then(hd => {
      if (!hd) return;
      const slot = document.getElementById('gate-remembered'); if (!slot) return;
      put(slot, btn('RECONNECT: ' + hd.name, async () => { try { await reconnect(hd); } catch (e) { gate(e.message || String(e)); } }));
    });
  }
  async function reload() {
    if (rootDir) { try { await refreshFromDisk(); if (NYC.refreshAll) NYC.refreshAll(); return; } catch (_) { /* fall through to the start screen */ } }
    gate('Choose the folder again to refresh what you see.');
  }

  /* ---- the sidebar box ---- */
  const boxEl = h('div', { class: 'srcbox' });
  function drawBox(count) {
    if (count !== undefined) fileCount = count;
    put(boxEl, h('b', { text: current.writable ? 'EDIT ACCESS ON' : 'READ-ONLY' }),
      h('div', { id: 'srclabel', text: current.label ? current.label + ' (' + current.how + ', ' + fileCount + ' files)' : 'No folder chosen' }),
      probeNote ? h('div', { class: 'hint', id: 'probenote', role: 'status', text: probeNote }) : null,
      h('div', { class: 'row' }, btn('CHANGE FOLDER', () => gate(), 'small'), btn('RELOAD', reload, 'small'), current.writable ? btn('TEST ACCESS', testWrite, 'small') : null));
  }
  NYC.sidebarExtra = () => { drawBox(); return boxEl; };
  NYC.viewer = { fromFileList, fromHandle, fromSnapshot, useData, testWrite };

  const start = () => { if (window.NYC_SNAPSHOT) useData(fromSnapshot(window.NYC_SNAPSHOT)); else gate(); };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const PAL = { k: '#070405', w: '#F8F8F8', g: '#288514', G: '#316C0F', b: '#739AC2', B: '#A2EFD9', t: '#FDE1CB', n: '#916446', s: '#808080', S: '#C0C0C0', y: '#E0B335', r: '#D33106', R: '#F79D18', d: '#9B2B0C' };
  // f0 is the base art; f1 replaces the listed rows (row number: new row).
  const ART = {

    cave: { f0: ['..ssss..', '.ssSSss.', 'ssSSSSss', 'ssskkkss', 'sskkkkss', 'sskkkkss', 'ssskkkss', 'tttttttt'], f1: { 3: 'ssskykss' } },
    anvil: { f0: ['........', 'sssssss.', 'SSSSSSss', '.sSSSss.', '..sSSs..', '..sSSs..', '.ssssss.', '.nnnnnn.'], f1: { 0: '.y...y..' } },
    tower: { f0: ['s.s.s.s.', 'sssssss.', 'sSSSSSs.', 'sSkSkSs.', 'sSSSSSs.', 'sSSkSSs.', 'sSSkSSs.', 'sssssss.'], f1: { 0: 'r.s.s.s.' } },

    scroll: { f0: ['.wwwwww.', 'wttttttw', '.wtkktw.', '.wttttw.', '.wtkkkw.', '.wttttw.', 'wttttttw', '.wwwwww.'], f1: { 4: '.wtkkRw.' } },
    hourglass: { f0: ['wwwwwwww', '.wbbbbw.', '..wbbw..', '...ww...', '...ww...', '..wbbw..', '.wbbbbw.', 'wwwwwwww'], f1: { 1: '.w....w.', 2: '..wbbw..', 5: '..wbbw..', 6: '.wbbbbw.' } },
    chest: { f0: ['.nnnnnn.', 'nnnnnnnn', 'nyyyyyyn', 'nnnyynnn', 'nnnyynnn', 'nnnnnnnn', 'nnnnnnnn', '........'], f1: { 0: 'nnnnnnnn', 1: '.nyyyyn.', 2: 'nnnnnnnn' } },
    gem: { f0: ['...bb...', '..bBBb..', '.bBBBBb.', 'bBBBBBBb', '.bBBBBb.', '..bBBb..', '...bb...', '........'], f1: { 2: '.bBwBBb.' } },

    heart: { f0: ['.rr.rr..', 'rrrrrrr.', 'rrrrrrr.', 'rrrrrrr.', '.rrrrr..', '..rrr...', '...r....', '........'] },
    heartx: { f0: ['.ss.ss..', 'sssssss.', 'sssssss.', 'sssssss.', '.sssss..', '..sss...', '...s....', '........'] },
    key: { f0: ['.yyyy...', 'y....y..', 'y....y..', '.yyyy...', '..y.....', '..yyy...', '..y.....', '..yy....'] },
    trophy: { f0: ['yyyyyyyy', 'y.yyyy.y', 'y.yyyy.y', '.yyyyyy.', '..yyyy..', '...yy...', '..nnnn..', '.nnnnnn.'] },
    stone: { f0: ['..ssss..', '.sSSSSs.', '.sSkSSs.', '.sSSkSs.', '.sSkSSs.', '.sSSSSs.', 'sssssss.', '........'] },

  function frame(rows) {
    const g = document.createElementNS(NS, 'g');

  };
})();

<script>
/* Safe markdown subset: text -> AST -> DOM. No HTML is ever parsed; every string goes in via textContent.
   Supported: headings, paragraphs, bold, italic, inline code, fenced code, links, [[wikilinks]], bare URLs,
   bullet / numbered / task lists (nested), tables, block quotes, horizontal rules. Frontmatter is skipped. */
(function (root) {
  'use strict';

  function inline(s) {
    const out = [];
    let buf = '', i = 0;
    const flush = () => { if (buf) { out.push({ t: 'text', v: buf }); buf = ''; } };
    while (i < s.length) {
      const c = s[i];
      if (c === '\\' && i + 1 < s.length && /[\\`*_{}\[\]()#+\-.!|>]/.test(s[i + 1])) { buf += s[i + 1]; i += 2; continue; }
      if (c === '`') {
        const j = s.indexOf('`', i + 1);
        if (j > i) { flush(); out.push({ t: 'code', v: s.slice(i + 1, j) }); i = j + 1; continue; }
      }
      if (s.startsWith('[[', i)) {
        const j = s.indexOf(']]', i + 2);
        if (j > 0) {
          flush();
          const parts = s.slice(i + 2, j).split('|');
          out.push({ t: 'wiki', target: parts[0].trim(), label: (parts[1] || parts[0]).trim() });
          i = j + 2; continue;
        }
      }
      if (s.startsWith('**', i)) {
        const j = s.indexOf('**', i + 2);
        if (j > i + 2) { flush(); out.push({ t: 'b', c: inline(s.slice(i + 2, j)) }); i = j + 2; continue; }
      }
      if ((c === '*' || c === '_') && s[i + 1] && s[i + 1] !== ' ' && s[i + 1] !== c && (c === '*' || !/\w/.test(s[i - 1] || ' '))) {
        const j = s.indexOf(c, i + 1);
        if (j > i + 1 && s[j - 1] !== ' ' && (c === '*' || !/\w/.test(s[j + 1] || ' '))) { flush(); out.push({ t: 'i', c: inline(s.slice(i + 1, j)) }); i = j + 1; continue; }
      }
      if (c === '[') {
        const m = /^\[([^\]]+)\]\(([^)\s]+)\)/.exec(s.slice(i));
        if (m) { flush(); out.push({ t: 'a', href: m[2], c: inline(m[1]) }); i += m[0].length; continue; }
      }
      if (c === 'h' && /^https?:\/\//.test(s.slice(i)) && !/\w/.test(s[i - 1] || ' ')) {
        const m = /^https?:\/\/[^\s<>)\]]+/.exec(s.slice(i));
        const url = m[0].replace(/[.,;:!?]+$/, '');
        flush(); out.push({ t: 'a', href: url, c: [{ t: 'text', v: url }] }); i += url.length; continue;
      }
      buf += c; i++;
    }
    flush();
    return out;
  }

  const RE_HEAD = /^(#{1,6})\s+(.*?)\s*#*\s*$/;
  const RE_HR = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
  const RE_LIST = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
  const RE_SEP = /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/;

  function cells(line) {
    let s = line.trim();
    if (s.startsWith('|')) s = s.slice(1);
    if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
    return s.split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
  }

  function blocks(lines) {
    const out = [];
    let i = 0;
    const startsBlock = (l) => RE_HEAD.test(l) || RE_HR.test(l) || /^```/.test(l) || /^\s*>/.test(l) || RE_LIST.test(l) || /^\s*\|/.test(l);
    while (i < lines.length) {
      const line = lines[i];
      if (!line.trim()) { i++; continue; }
      let m;
      if (/^```/.test(line)) {
        const lang = line.slice(3).trim();
        const buf = [];
        i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++;
        out.push({ t: 'code', lang, text: buf.join('\n') });
        continue;
      }
      if ((m = RE_HEAD.exec(line))) { out.push({ t: 'h', level: m[1].length, c: inline(m[2]), text: m[2] }); i++; continue; }
      if (RE_HR.test(line)) { out.push({ t: 'hr' }); i++; continue; }
      if (/^\s*>/.test(line)) {
        const buf = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push({ t: 'quote', c: blocks(buf) });
        continue;

function parseHash() {
  const raw = location.hash.replace(/^#\/?/, '');
  const qi = raw.indexOf('?');
  const pathPart = qi >= 0 ? raw.slice(0, qi) : raw;
  const q = Object.fromEntries(new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : ''));
  const parts = pathPart.split('/');

}
function navFor(r) {
  const a = r.arg;
  if (r.name === 'dashboard') return 'dashboard';
  if (r.name === 'activity') return 'activity';
  if (r.name === 'deal') return 'pipeline';
  if (r.name === 'files' || r.name === 'search') return 'files';
  if (r.name === 'list') return { line: 'line', work: 'proof', pitch: 'outreach', ask: 'outreach', opportunity: 'outreach', engagement: 'pipeline', brief: 'pipeline', quote: 'quotes', time: 'hours' }[a] || 'files';
  if (r.name === 'rows') return { evidence: 'proof', people: 'proof', ledger: 'ledger', 'quote-history': 'ledger', rates: 'rates', time: 'hours' }[a] || 'files';
  if (r.name === 'doc') {
    if (/^the-next-yes\/work\//.test(a) || /evidence|people/.test(a)) return 'proof';
    if (/-pitch-|-ask-|opportunities\//.test(a)) return 'outreach';
    if (/^the-next-yes\/outputs\//.test(a) || /START-HERE|me\.md/.test(a)) return 'line';
    if (/quote-v\d+\.md$/.test(a)) return 'quotes';
    if (/\/time\.md$/.test(a)) return 'hours';
    if (/^finances\/rates/.test(a)) return 'rates';
    if (/^finances\/[^/]+\/[^/]+\//.test(a)) return 'pipeline';
  }
  return 'files';
}
let renderToken = 0;
async function render(focus = true) {

  if (focus) put(view, h('p', { class: 'muted', text: 'Loading...' }));

    if (tok !== renderToken) return;

}

  }
  const initial = {};
  if (row) data.header.forEach((n, i) => { initial[n] = row.cells[i]; });
  const form = NYC.buildForm(NYC.rowSpec(data, action), initial);
  openDrawer((action === 'add' ? 'ADD ROW: ' : 'EDIT ROW ' + (row.index + 1) + ': ') + data.label, action === 'add' ? () => startRow(table, path, 'add', data, null) : null);
  fillScreen(form, (fields) => {
    const payload = { table, path, action, fields, base_sha256: data.sha256 };
    if (row) { payload.index = row.index; payload.row_sha = row.row_sha; }
    return { endpoint: '/api/plan/row', payload };
  });
}
async function startRowAdd(table) { try { const data = await api('/api/rows?table=' + table); startRow(table, null, 'add', data, null); } catch (e) { alert(e.message); } }
function startRowVoid(table, path, data, row) {
  openDrawer('VOID ROW ' + (row.index + 1) + ': ' + data.label);
  planRun('/api/plan/row', { table, path, action: 'void', index: row.index, row_sha: row.row_sha, base_sha256: data.sha256 }, null);
}
function startEdit(payload) { openDrawer('EDIT ' + NYC.titleFromPath(payload.path)); planRun('/api/plan/edit', payload, null); }
function startRestore(path, backup) { openDrawer('UNDO ' + NYC.titleFromPath(path)); planRun('/api/plan/restore', { path, backup }, null); }
async function startRaw(path) {
  let f;
  try { f = await api('/api/file?path=' + encodeURIComponent(path)); } catch (e) { alert(e.message); return; }
  const ta = h('textarea', { class: 'raw', 'aria-label': 'File content', spellcheck: 'false' }); ta.value = f.content;
  openDrawer('RAW EDIT ' + NYC.titleFromPath(path));
  const form = { el: h('div', {}, f.banner ? h('div', { class: 'banner', text: f.banner.toUpperCase() + ' FILE' }) : null, h('p', { class: 'hint', text: `Version #${f.sha256.slice(0, 8)}. This is the raw file: you can change anything, including removing rows.` }), ta),
    inputs: {}, values: () => ({ content: ta.value }), clearErrors() {}, setError() {} };
  fillScreen(form, (v) => ({ endpoint: '/api/plan/scroll', payload: { path: f.path, content: v.content, base_sha256: f.sha256 } }));
}

/* =============== + NEW menu, search, keyboard =============== */
const NEWMENU = [
  ['DEALS', [['New lead', 'lead'], ['Stage update', 'update'], ['Agreement', 'agreement'], ['Log hours', 'hours'], ['Quote draft', 'quote'], ['Delivered', 'delivered']]],
  ['GROW', [['The one line', 'line'], ['Work record', 'work'], ['Pitch', 'pitch'], ['Ask or opportunity', 'ask']]],
  ['ROWS', [['Evidence row', 'row:evidence'], ['Person', 'row:people'], ['Ledger row', 'row:ledger'], ['Rate data point', 'row:rates'], ['Quote-history row', 'row:quote-history']]],
];
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; $('#newbtn').setAttribute('aria-expanded', 'false'); } }
function openMenu() {
  closeMenu();
  const groups = NEWMENU.map(([grp, items]) => [grp, items.filter(([, k]) => k.startsWith('row:') || can(k))]).filter(([, items]) => items.length);
  menuEl = h('div', { class: 'menu', role: 'menu', 'aria-label': 'Create' }, groups.map(([grp, items]) => [h('h2', { text: grp }), items.map(([t, k]) => h('button', { type: 'button', role: 'menuitem', text: t, onclick: () => { closeMenu(); if (k.startsWith('row:')) startRowAdd(k.slice(4)); else startCreate(k); } }))]));
  $('.newwrap').append(menuEl);
  $('#newbtn').setAttribute('aria-expanded', 'true');
  const first = $('button', menuEl); if (first) first.focus();
  menuEl.addEventListener('keydown', (e) => {
    const items = [...menuEl.querySelectorAll('button')], i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
  });
}
function openHelp() {
  openDrawer('HELP');
  const keys = h('ul', {}, ['/  search', 'g then d  go to the dashboard', '?  this help', 'Esc  close this panel'].map(t => h('li', { text: t })));
  if (NYC.VIEWER && NYC.READONLY) {
    put(dbody, h('p', { text: 'This folder is open read-only, so nothing here can change it.' }),
      h('h3', { text: 'Using it' }), h('ul', {}, ['CHANGE FOLDER chooses a different folder. RELOAD reads the folder again.', 'To edit, use Chrome or Edge: CHANGE FOLDER, then OPEN FOLDER TO EDIT, and allow it when the browser asks.', 'Choose the folder that has finances/ and the-next-yes/ inside, or its parent. Only that folder is used.', 'Nothing leaves this computer: the page blocks every network request.'].map(t => h('li', { text: t }))),
      h('h3', { text: 'Keys' }), keys);
    return;
  }
  if (NYC.VIEWER) {
    put(dbody, h('p', { text: 'You can edit this folder. Open a document and press EDIT or RAW, add or change rows in the ledger and the other tables, and use + NEW. Every save is shown first; nothing is written until you confirm.' }),
      h('h3', { text: 'Safety' }), h('ul', {}, ['The old version of any file a save changes is copied into the .backups folder inside your folder. Press UNDO LAST on a document to bring it back.', 'If the file changed after you opened it (in another editor, say), the save stops and tells you instead of overwriting it.', 'Rows are voided, never deleted. RAW can delete text, with a backup.', 'Keep logins and keys out of this folder. Nothing leaves this computer: the page blocks every network request.'].map(t => h('li', { text: t }))),
      h('h3', { text: 'Keys' }), h('ul', {}, ['/  search', 'n  open the + NEW menu', 'g then d  go to the dashboard', '?  this help', 'Esc  close the menu or panel', 'A or Ctrl+Enter  confirm a preview', 'B  go back from a preview'].map(t => h('li', { text: t }))));
    return;
  }
  put(dbody, h('p', { text: 'Pick a place in the side menu. Create things with + NEW. Every save is previewed first, overwrites keep a backup, and HISTORY can undo them.' }),
    h('h3', { text: 'Keys' }), h('ul', {}, ['/  search', 'n  open the + NEW menu', 'g then d  go to the dashboard', '?  this help', 'Esc  close the menu or drawer', 'A or Ctrl+Enter  confirm a preview', 'B  go back from a preview'].map(t => h('li', { text: t }))),
    h('h3', { text: 'Rules' }), h('ul', {}, ['Keep logins and keys out of this folder. No form here asks for them.', 'Rows are voided, never deleted. The raw editor can delete text, with a backup.', 'Nothing leaves this computer.'].map(t => h('li', { text: t }))));
}
const typing = () => { const a = document.activeElement; return a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || a.isContentEditable); };
let gPending = false;
document.addEventListener('keydown', (e) => {
  const drawerOpen = !drawer.hidden;
  if (e.key === 'Escape') {
    if (menuEl) { closeMenu(); $('#newbtn').focus(); return; }
    if (drawerOpen) { e.preventDefault(); closeDrawer(); return; }
    if (document.body.classList.contains('nav-open')) { document.body.classList.remove('nav-open'); $('#menubtn').setAttribute('aria-expanded', 'false'); $('#menubtn').focus(); }
    return;
  }
  if (drawerOpen && e.key === 'Tab') {
    const f = [...drawer.querySelectorAll('button,input,select,textarea,a[href]')].filter(x => !x.disabled && x.offsetParent !== null);
    if (f.length) { const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    return;
  }
  if (drawerOpen && (e.ctrlKey || e.metaKey) && e.key === 'Enter' && DR.confirm) { e.preventDefault(); DR.confirm(); return; }
  if (typing() || e.ctrlKey || e.metaKey || e.altKey) return;
  if (drawerOpen) {
    if ((e.key === 'a' || e.key === 'A') && DR.confirm) { e.preventDefault(); DR.confirm(); }
    else if ((e.key === 'b' || e.key === 'B') && DR.back && DR.confirm) { e.preventDefault(); DR.back(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'n' && !NYC.READONLY) { e.preventDefault(); openMenu(); return; }
  if (e.key === '?') { e.preventDefault(); openHelp(); return; }
  if (e.key === 'g') { gPending = true; setTimeout(() => { gPending = false; }, 900); return; }
  if (e.key === 'd' && gPending) { gPending = false; location.hash = '#/dashboard'; }
});
document.addEventListener('click', (e) => {
  if (menuEl && !e.target.closest('.newwrap')) closeMenu();
  if (document.body.classList.contains('nav-open') && !e.target.closest('#side') && !e.target.closest('#menubtn')) { document.body.classList.remove('nav-open'); $('#menubtn').setAttribute('aria-expanded', 'false'); }
});
$('#newbtn').addEventListener('click', () => (menuEl ? closeMenu() : openMenu()));
$('#drawer-close').addEventListener('click', () => closeDrawer());
backdrop.addEventListener('click', () => closeDrawer());
$('#menubtn').addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); $('#menubtn').setAttribute('aria-expanded', String(open)); if (open) { const a = $('#side a'); if (a) a.focus(); } });
$('#searchform').addEventListener('submit', (e) => { e.preventDefault(); const q = $('#q').value.trim(); if (q) location.hash = '#/search?q=' + encodeURIComponent(q); });
window.addEventListener('hashchange', () => render(true));

/* =============== start =============== */
let saved = null;
try { saved = localStorage.getItem('nyc-calm'); } catch (_) { /* storage blocked: default below */ }
buildNav();
setCalm(saved === '1' || (saved === null && window.matchMedia('(prefers-reduced-motion: reduce)').matches));
if (!location.hash) location.hash = '#/dashboard';
loadChrome().catch(() => {}).then(() => render(true));
})();

</script>
